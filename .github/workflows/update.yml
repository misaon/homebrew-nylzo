name: Update

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Verify the latest release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.render.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - id: render
        env:
          GH_TOKEN: ${{ github.token }}
        run: update/render
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            Formula/nylzo.rb
            bucket/nylzo.json
          if-no-files-found: error
          retention-days: 1

  install:
    name: Install on ${{ matrix.runner }}
    needs: render
    if: needs.render.outputs.changed == 'true' || github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
      - if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >>"$GITHUB_PATH"
      - if: runner.os != 'Windows'
        run: update/test-homebrew
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./update/test-scoop.ps1

  publish:
    name: Publish
    needs: [render, install]
    if: needs.render.outputs.changed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # commit the verified formula and manifest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
      - env:
          GH_TOKEN: ${{ github.token }}
        run: update/publish
